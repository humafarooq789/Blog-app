<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create a post — Inkwell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">Inkwell</a>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="login.html">Log in</a>
        <a href="register.html" class="btn btn-primary">Register</a>
      </nav>
    </div>
  </header>

  <main class="form-page-solo">
    <div class="form-card-wide">

      <h1>Write a new post</h1>
      <p class="form-intro">Fill this in, then publish. You can always edit it later from your dashboard.</p>

      <form id="create-post-form" novalidate>

        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" placeholder="Give your post a title">
          <p class="error" data-error-for="title"></p>
        </div>

        <div class="field">
          <label for="body">Post body</label>
          <textarea id="body" name="body" placeholder="Start writing..."></textarea>
          <p class="char-count"><span id="char-count">0</span> characters</p>
          <p class="error" data-error-for="body"></p>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Publish</button>
          <a href="dashboard.html" class="btn">Cancel</a>
        </div>

        <p class="error" id="form-message"></p>
      </form>

    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Inkwell — a place to write things down.</p>
      <p>&copy; <span id="year">2026</span> Inkwell</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/posts-store.js"></script>
  <script src="js/create-post.js"></script>
</body>
</html>
