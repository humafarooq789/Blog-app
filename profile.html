<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your profile — Inkwell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">Inkwell</a>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="dashboard.html" class="auth-only">Dashboard</a>

        <a href="login.html" class="btn guest-only">Log in</a>
        <a href="register.html" class="btn btn-primary guest-only">Register</a>

        <div class="profile-menu auth-only">
          <button class="profile-toggle" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Account menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path></svg>
          </button>
          <div class="profile-dropdown">
            <a href="profile.html" class="is-active">Profile</a>
            <button id="logout-btn" type="button">Logout</button>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main class="form-page-solo">
    <div class="form-card-wide">

      <h1>Your profile</h1>
      <p class="form-intro">The details you registered with.</p>

      <div>
        <div class="profile-info-row">
          <span class="profile-info-label">Full name</span>
          <span class="profile-info-value" id="profile-name">—</span>
        </div>
        <div class="profile-info-row">
          <span class="profile-info-label">Email</span>
          <span class="profile-info-value" id="profile-email">—</span>
        </div>
        <div class="profile-info-row">
          <span class="profile-info-label">Phone number</span>
          <span class="profile-info-value" id="profile-phone">—</span>
        </div>
      </div>

      <div class="form-actions" style="margin-top: 28px;">
        <button id="profile-logout-btn" class="btn btn-danger" type="button">Log out</button>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Inkwell — a place to write things down.</p>
      <p>&copy; <span id="year">2026</span> Inkwell</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/session.js"></script>
  <script>
    const user = getCurrentUser();
    if (user) {
      document.querySelector('#profile-name').textContent = user.name;
      document.querySelector('#profile-email').textContent = user.email;
      document.querySelector('#profile-phone').textContent = user.phone;
    }

    document.querySelector('#profile-logout-btn').addEventListener('click', function () {
      clearCurrentUser();
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
