<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Inkwell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">Inkwell</a>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="login.html">Log in</a>
        <a href="register.html" class="btn btn-primary is-active">Register</a>
      </nav>
    </div>
  </header>

  <main class="form-page">
    <div class="form-image">
      <img src="https://picsum.photos/seed/inkwell-register/900/1200" alt="Desk with a typewriter and plant">
    </div>

    <div class="form-card-wrap">
      <div class="form-card">
        <h1>Create your account</h1>
        <p class="form-intro">Start writing in about thirty seconds.</p>

        <form id="register-form" novalidate>
          <div class="field">
            <label for="name">Full name</label>
            <input type="text" id="name" name="name" placeholder="Sara Nadeem">
            <p class="error" data-error-for="name"></p>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com">
            <p class="error" data-error-for="email"></p>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="At least 8 characters">
            <p class="error" data-error-for="password"></p>
          </div>

          <div class="field">
            <label for="confirm">Confirm password</label>
            <input type="password" id="confirm" name="confirm" placeholder="Type it again">
            <p class="error" data-error-for="confirm"></p>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Create account</button>
          <p class="error" id="form-message"></p>
        </form>

        <p class="form-foot">Already have an account? <a href="login.html">Log in</a></p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Inkwell — a place to write things down.</p>
      <p>&copy; <span id="year">2026</span> Inkwell</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
