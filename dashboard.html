<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Inkwell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">Inkwell</a>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
      <nav class="nav">
        <a href="index.html">Home</a>
      
        <a href="login.html">Log in</a>
        <a href="register.html" class="btn btn-primary">Register</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="dash-header">
      <div class="container dash-header-row">
        <div>
          <h1>Welcome back, Huma</h1>
          <p>Here's everything you've published so far.</p>
        </div>
        <a href="create-blog.html" class="btn btn-primary">+ New post</a>
      </div>
    </section>

    <section class="dash-posts">
      <div class="container">
        <div class="dash-grid" id="dash-grid"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Inkwell — a place to write things down.</p>
      <p>&copy; <span id="year">2026</span> Inkwell</p>
    </div>
  </footer>

  <script src="./main.js"></script>
<script src="./posts-store.js"></script>
<script src="./js/dashboard.js"></script>
</body>
</html>
